<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-site-name>Lumens Manual Center</title>
<meta name="theme-color" content="#008ed3">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <section class="hero">
    <div class="container">
      <h1 id="heroTitle">Find the manual for your Lumens product</h1>
      <p class="lede" id="heroSubtitle">Loading…</p>
      <div class="hero-search">
        <form id="heroSearchForm" role="search">
          <input type="search" id="heroSearchInput" name="q" placeholder="Search…">
          <button type="submit">Search</button>
        </form>
      </div>
    </div>
  </section>

  <section class="page-section">
    <div class="container">
      <div class="entry-grid">
        <div id="entryProduct"></div>
        <div id="entryType"></div>
      </div>

      <div class="section-head">
        <h2 id="quickLinksTitle" style="font-size:16px;"></h2>
      </div>
      <div id="quickLinks"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/page-home.js"></script>
</body>
</html>
