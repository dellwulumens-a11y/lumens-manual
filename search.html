<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-site-name>Lumens Manual Center</title>
<meta name="theme-color" content="#008ed3">
<link rel="stylesheet" href="assets/css/style.css?v=8f4a122">
</head>
<body data-page="search">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>

<main id="main">
  <section class="search-hero">
    <div class="container">
      <h1 id="searchTitle" style="font-size:24px; margin-bottom:16px;">Search results</h1>
      <form id="searchForm" action="search.html" role="search">
        <input type="search" id="searchInput" name="q" placeholder="Search…">
        <input type="hidden" name="lang" id="searchLangField">
        <button type="submit">Search</button>
      </form>
      <div class="search-filters" id="searchFilters">
        <label><span id="categoryFilterLabel">Product line</span><select id="categoryFilter" name="category"></select></label>
        <label><span id="typeFilterLabel">Document type</span><select id="typeFilter" name="type"></select></label>
        <label><span id="docLangFilterLabel">Document language</span><select id="docLangFilter" name="docLang"></select></label>
        <button class="filter-clear" id="clearFilters" type="button">Clear filters</button>
      </div>
      <p class="result-count" id="resultCount"></p>
    </div>
  </section>

  <section class="page-section" style="padding-top:0;">
    <div class="container" id="searchResults"></div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js?v=site-v1.1.2"></script>
<script src="assets/js/page-search.js"></script>
</body>
</html>
