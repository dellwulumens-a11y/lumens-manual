<title>TP-200 上手指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Manrope:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#eef1f6;
  --line:#dbe1ea;
  --ink:#131c26;
  --ink-soft:#57657a;
  --ink-faint:#8b97a8;
  --brand:#175fa8;
  --brand-ink:#0d3f75;
  --brand-tint:#e8f0fb;
  --accent:#dd8a2e;
  --accent-tint:#fbeddb;
  --good:#2f8f5b;
  --shadow:0 1px 2px rgba(20,30,45,.04), 0 8px 24px -12px rgba(20,30,45,.16);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b131d;
    --surface:#121d29;
    --surface-2:#182534;
    --line:#26374a;
    --ink:#e9eef4;
    --ink-soft:#a9b7c7;
    --ink-faint:#6d7d90;
    --brand:#5b9ce0;
    --brand-ink:#bcdcff;
    --brand-tint:#16273b;
    --accent:#e8a350;
    --accent-tint:#2c2013;
    --good:#5cc48b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0b131d;
  --surface:#121d29;
  --surface-2:#182534;
  --line:#26374a;
  --ink:#e9eef4;
  --ink-soft:#a9b7c7;
  --ink-faint:#6d7d90;
  --brand:#5b9ce0;
  --brand-ink:#bcdcff;
  --brand-tint:#16273b;
  --accent:#e8a350;
  --accent-tint:#2c2013;
  --good:#5cc48b;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans TC','Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
h1,h2,h3{text-wrap:balance; margin:0}
p{margin:0}
img{display:block}

/* ---------- layout shell ---------- */
.shell{display:flex; min-height:100vh}

.sidebar{
  width:264px; flex:none;
  background:var(--surface);
  border-right:1px solid var(--line);
  position:fixed; top:0; left:0; bottom:0;
  display:flex; flex-direction:column;
  transform:translateX(0);
  transition:transform .25s ease;
  z-index:40;
}
.sidebar-head{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
}
.brand-mark{
  font-family:'Manrope'; font-weight:800; font-size:20px; letter-spacing:.01em;
  color:var(--ink);
}
.brand-mark span{color:var(--brand)}
.brand-sub{margin-top:4px; font-size:11.5px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase}

.navlist{list-style:none; margin:0; padding:10px 10px 20px; overflow-y:auto; flex:1}
.navlist li{margin:1px 0}
.navlink{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left; border:none; background:none; cursor:pointer;
  padding:9px 10px; border-radius:9px;
  color:var(--ink-soft); font-size:13.5px; font-weight:500;
  font-family:inherit;
}
.navlink .navnum{
  font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-faint);
  width:20px; flex:none;
}
.navlink:hover{background:var(--surface-2); color:var(--ink)}
.navlink.active{background:var(--brand-tint); color:var(--brand-ink); font-weight:700}
.navlink.active .navnum{color:var(--brand)}

.sidebar-foot{
  padding:14px 20px 18px; border-top:1px solid var(--line);
  font-size:11px; color:var(--ink-faint); line-height:1.6;
}

.menubtn{
  display:none; position:fixed; top:14px; left:14px; z-index:50;
  width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow); align-items:center; justify-content:center;
  cursor:pointer;
}
.menubtn svg{width:18px;height:18px;stroke:var(--ink)}
.scrim{display:none; position:fixed; inset:0; background:rgba(10,16,24,.45); z-index:39}

main{
  margin-left:264px; flex:1; min-width:0;
  display:flex; flex-direction:column;
  min-height:100vh;
}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 44px; border-bottom:1px solid var(--line);
  background:var(--bg);
  position:sticky; top:0; z-index:20;
}
.progress-track{
  flex:1; height:4px; background:var(--surface-2); border-radius:3px; margin:0 20px; overflow:hidden;
}
.progress-fill{height:100%; background:var(--brand); border-radius:3px; transition:width .3s ease}
.topbar-label{font-size:12px; color:var(--ink-faint); font-family:'IBM Plex Mono'; white-space:nowrap}

.stage{flex:1; padding:8px 44px 90px; max-width:920px; width:100%}

.panel{display:none; animation:fadeUp .35s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){ .panel{animation:none} }

.eyebrow{
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.eyebrow .tag{
  font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; letter-spacing:.08em;
  color:var(--brand); background:var(--brand-tint); padding:4px 9px; border-radius:6px;
}
.eyebrow .idx{font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink-faint)}

h1.ch-title{font-size:30px; font-weight:900; line-height:1.25; margin-bottom:10px}
.lede{font-size:15.5px; color:var(--ink-soft); line-height:1.75; max-width:62ch; margin-bottom:28px}
.lede b{color:var(--ink); font-weight:700}

.section-gap{margin-top:34px}
.small-h{font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:14px}

/* ---------- cards & grids ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.shot{padding:16px; text-align:center}
.shot img{width:100%; height:auto; border-radius:8px; margin:0 auto; background:#fff}
.shot.dark img{background:#11151b}
.shot figcaption{margin-top:12px; font-size:12.5px; color:var(--ink-faint)}

.grid{display:grid; gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){ .grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)} }

.spec-card{
  padding:16px 16px; display:flex; gap:12px; align-items:flex-start;
}
.spec-card .icon-box{
  width:38px; height:38px; border-radius:9px; background:var(--brand-tint); flex:none;
  display:flex; align-items:center; justify-content:center;
}
.spec-card .icon-box svg{width:20px; height:20px; stroke:var(--brand)}
.spec-card .num{font-family:'IBM Plex Mono'; font-weight:600; font-size:14.5px; color:var(--ink)}
.spec-card .lbl{font-size:12px; color:var(--ink-faint); margin-top:2px; line-height:1.5}

.use-card{padding:20px 18px}
.use-card .icon-box{
  width:42px; height:42px; border-radius:10px; background:var(--accent-tint); margin-bottom:12px;
  display:flex; align-items:center; justify-content:center;
}
.use-card .icon-box svg{width:22px; height:22px; stroke:var(--accent)}
.use-card h3{font-size:15px; font-weight:700; margin-bottom:6px}
.use-card p{font-size:12.5px; color:var(--ink-soft); line-height:1.65}

.port-row{
  display:flex; gap:14px; align-items:flex-start; padding:13px 4px; border-bottom:1px solid var(--line);
}
.port-row:last-child{border-bottom:none}
.port-row .pnum{
  font-family:'IBM Plex Mono'; font-weight:700; font-size:12px; color:#fff; background:var(--brand);
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; margin-top:1px;
}
.port-row .pname{font-size:14px; font-weight:700; margin-bottom:2px}
.port-row .pdesc{font-size:12.5px; color:var(--ink-soft); line-height:1.6}

.callout{
  border-radius:var(--radius); padding:16px 18px; display:flex; gap:12px; align-items:flex-start;
  background:var(--accent-tint); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
}
.callout svg{width:18px; height:18px; stroke:var(--accent); flex:none; margin-top:2px}
.callout .t{font-size:13px; font-weight:700; margin-bottom:3px; color:var(--ink)}
.callout .d{font-size:12.5px; color:var(--ink-soft); line-height:1.65}

.ipbox{
  display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono'; font-weight:600;
  background:var(--surface-2); border:1px solid var(--line); padding:6px 12px; border-radius:8px; font-size:13.5px;
}

.steps{display:flex; gap:10px; flex-wrap:wrap}
.step{
  flex:1; min-width:150px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:16px 14px; position:relative; box-shadow:var(--shadow);
}
.step .sn{
  font-family:'IBM Plex Mono'; font-weight:700; font-size:11px; color:var(--brand);
  background:var(--brand-tint); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:10px;
}
.step h4{font-size:13.5px; font-weight:700; margin-bottom:4px}
.step p{font-size:11.5px; color:var(--ink-faint); line-height:1.5}
.step-arrow{display:flex; align-items:center; color:var(--ink-faint); font-size:16px}
@media (max-width:760px){ .step-arrow{display:none} }

.comp-card{padding:16px 14px; text-align:left}
.comp-card .icon-box{
  width:34px; height:34px; border-radius:8px; background:var(--surface-2); margin-bottom:10px;
  display:flex; align-items:center; justify-content:center;
}
.comp-card .icon-box svg{width:18px; height:18px; stroke:var(--ink-soft)}
.comp-card h4{font-size:13.5px; font-weight:700; margin-bottom:4px}
.comp-card p{font-size:12px; color:var(--ink-faint); line-height:1.55}

.cat-card{padding:20px 18px; border-left:3px solid var(--brand)}
.cat-card h4{font-size:14.5px; font-weight:700; margin-bottom:6px}
.cat-card p{font-size:12.5px; color:var(--ink-soft); line-height:1.65}

.eco-card{padding:16px; display:flex; flex-direction:column; gap:4px}
.eco-card .name{font-size:14px; font-weight:700}
.eco-card .model{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-faint)}
.eco-card .role{font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.5}

.faq{border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:none}
.faq-q{
  width:100%; text-align:left; background:none; border:none; cursor:pointer; font-family:inherit;
  padding:17px 4px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  font-size:14.5px; font-weight:700; color:var(--ink);
}
.faq-q svg{width:16px; height:16px; stroke:var(--ink-faint); flex:none; transition:transform .2s ease}
.faq.open .faq-q svg{transform:rotate(45deg)}
.faq-a{max-height:0; overflow:hidden; transition:max-height .25s ease}
.faq.open .faq-a{max-height:220px}
.faq-a p{font-size:13px; color:var(--ink-soft); line-height:1.75; padding:0 4px 18px}

table.spectable{width:100%; border-collapse:collapse; font-size:13px}
table.spectable th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);
  padding:0 12px 10px; font-weight:600; border-bottom:1px solid var(--line);
}
table.spectable td{padding:11px 12px; border-bottom:1px solid var(--line); color:var(--ink-soft); vertical-align:top}
table.spectable td:first-child{color:var(--ink); font-weight:600; width:32%; white-space:nowrap}
table.spectable tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto}

.foot-nav{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-top:44px; padding-top:22px; border-top:1px solid var(--line);
}
.nb{
  display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px;
  background:var(--surface); border:1px solid var(--line); cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:600; color:var(--ink); box-shadow:var(--shadow);
}
.nb:disabled{opacity:.35; cursor:default}
.nb svg{width:15px; height:15px; stroke:currentColor}
.nb.primary{background:var(--brand); border-color:var(--brand); color:#fff}

/* ---------- cover ---------- */
.cover{min-height:calc(100vh - 16px); flex-direction:column; justify-content:center}
.panel.cover.active{display:flex}
.cover-tag{
  display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono'; font-size:12px;
  color:var(--brand); background:var(--brand-tint); padding:6px 12px; border-radius:20px; margin-bottom:22px; width:fit-content;
  font-weight:600; letter-spacing:.03em;
}
.cover-tag svg{width:15px; height:15px; stroke:var(--brand); flex:none}
.cover-title{font-family:'Manrope'; font-weight:800; font-size:64px; line-height:1; letter-spacing:-.01em; margin-bottom:14px}
.cover-title span{color:var(--brand)}
.cover-sub{font-size:19px; font-weight:500; color:var(--ink-soft); margin-bottom:20px}
.cover-desc{font-size:14.5px; color:var(--ink-soft); max-width:52ch; line-height:1.8; margin-bottom:30px}
.cover-tags{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:36px}
.cover-tags span{
  font-size:12px; font-family:'IBM Plex Mono'; padding:6px 11px; border-radius:7px; background:var(--surface-2); color:var(--ink-soft);
  border:1px solid var(--line);
}
.cover-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:44px; align-items:center}
@media (max-width:820px){ .cover-grid{grid-template-columns:1fr} .cover-title{font-size:44px} }
.cover-shot{padding:26px}
.cover-shot img{max-width:280px; margin:0 auto}
.startbtn{
  display:inline-flex; align-items:center; gap:10px; background:var(--brand); color:#fff; border:none;
  padding:13px 22px; border-radius:11px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
  box-shadow:var(--shadow); width:fit-content;
}
.startbtn svg{width:16px; height:16px; stroke:#fff}
</style>

<div class="shell">
  <button class="menubtn" id="menubtn" aria-label="開啟章節選單">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="scrim" id="scrim"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark">Lumens<span>·</span>TP-200</div>
      <div class="brand-sub">產品培訓手冊</div>
    </div>
    <ul class="navlist" id="navlist"></ul>
    <div class="sidebar-foot">Lumens Digital Optics Inc.<br>TP-200 內部培訓資料 · v1.0</div>
  </nav>

  <main>
    <div class="topbar">
      <div class="topbar-label" id="topLabel">00 / 13</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="topbar-label" id="topChapterName">封面</div>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>

<script>
/* ============ ICONS ============ */
const ICON = {
  screen:'<path d="M3 5h18v12H3z"/><path d="M8 21h8M12 17v4"/>',
  church:'<path d="M12 3v4M9 5h6M6 21V11l6-5 6 5v10"/><path d="M6 21h12M10 21v-6h4v6"/>',
  meeting:'<circle cx="12" cy="8" r="3"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="4" cy="10" r="2"/><circle cx="20" cy="10" r="2"/>',
  class:'<path d="M4 4h16v12H4z"/><path d="M4 20h16M9 16v4M15 16v4"/>',
  chip:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M7 3v0M3 7h0"/>',
  wifi:'<path d="M4 9a13 13 0 0 1 16 0M7 12.5a8.5 8.5 0 0 1 10 0M10 16a4 4 0 0 1 4 0"/><circle cx="12" cy="19" r="1"/>',
  power:'<path d="M12 3v8"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/>',
  ruler:'<path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v3M15 8v3M19 8v3"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-3 3-2-2z"/>',
  net:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6.5 7.5 11 16.5M17.5 7.5 13 16.5"/>',
  lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/>',
  button:'<rect x="4" y="9" width="16" height="6" rx="3"/>',
  toggle:'<rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="16" cy="12" r="3"/>',
  slider:'<path d="M4 12h16"/><circle cx="14" cy="12" r="3"/>',
  tabs:'<rect x="3" y="6" width="18" height="14" rx="1"/><path d="M3 10h18M8 6v0"/>',
  textv:'<path d="M4 6h16M4 12h10M4 18h13"/>',
  input:'<rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 12h.01"/>',
  matrix:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  knob:'<circle cx="12" cy="12" r="7"/><path d="M12 8v4l3 2"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',
  cable:'<path d="M6 4v6a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v2"/><circle cx="6" cy="3" r="1.5"/><circle cx="18" cy="21" r="1.5"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  bell:'<path d="M6 10a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  cam:'<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
  video:'<rect x="4" y="6" width="12" height="12" rx="2"/><path d="m16 10 4-2v8l-4-2"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  record:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  head:'<circle cx="12" cy="8" r="4"/><path d="M6 20c0-4 3-6 6-6s6 2 6 6"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6 6 2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/>',
  chat:'<path d="M4 5h16v11H8l-4 4V5Z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  book:'<path d="M4 5c3 0 5 1 8 3 3-2 5-3 8-3v13c-3 0-5 1-8 3-3-2-5-3-8-3Z"/>',
};
function ic(name, cls){ return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</svg>`; }

/* ============ CHAPTER DATA ============ */
const chapters = [];
function addChapter(id, tag, name, html){ chapters.push({id,tag,name,html}); }

/* ---- 00 cover ---- */
addChapter('cover','START','封面', `
<div class="panel cover">
  <div class="cover-grid">
    <div>
      <div class="cover-tag">${ic('spark')} Lumens 第一款設備控制硬體產品</div>

/* ---- 01 overview ---- */
addChapter('overview','OVERVIEW','什麼是 TP-200', `
<div class="panel">
  <div class="eyebrow"><span class="tag">CH.01 · OVERVIEW</span></div>
  <h1 class="ch-title">什麼是 TP-200？</h1>
  <p class="lede">一句話：<b>TP-200 是一片會思考的螢幕</b>。它讓使用者用「手指點一下」，就能啟動、控制會議室或教室裡的各種設備 — 不用面對一堆遙控器。</p>

  <div class="callout">
    ${ic('layers')}
    <div><div class="t">定位：觸控「控制面板」，不是萬能主機</div>
    <div class="d">TP-200 的產品定位是 Touch Control Panel（觸控控制面板），目的是讓 Lumens 的影音方案更完整 — 而不是要跟 Crestron、Extron、ATEN 等專業環控廠商正面競爭。</div></div>
  </div>

  <div class="section-gap">
    <div class="small-h">最適合導入的場景</div>
    <div class="grid grid-3">
      <div class="card use-card"><div class="icon-box">${ic('church')}</div><h3>教堂</h3><p>燈光、投影、影音一鍵切換，志工也能輕鬆操作。</p></div>
      <div class="card use-card"><div class="icon-box">${ic('meeting')}</div><h3>企業中／大型會議室</h3><p>視訊會議、簡報模式一鍵啟動，取代多支遙控器。</p></div>
      <div class="card use-card"><div class="icon-box">${ic('class')}</div><h3>教育多功能教室</h3><p>老師專心上課，不必分心操作中控設備。</p></div>
    </div>
  </div>

  <div class="section-gap callout" style="background:var(--brand-tint); border-color:color-mix(in srgb, var(--brand) 30%, transparent)">
    ${ic('cam',)}
    <div><div class="t">跟 Lumens 全系列產品天生一對</div>
    <div class="d">TP-200 目前優先整合 Lumens 自家產品：CamConnect Pro、VoiceConnect、OIP-N 影音矩陣、LC 錄播主機與 VC 系列攝影機。詳見第 10 章「Lumens 生態系整合」。</div></div>
  </div>
</div>`);

/* ---- 02 hardware ---- */
addChapter('hardware','HARDWARE','認識硬體', `
<div class="panel">

<div class="panel">

  <h1 class="ch-title">安裝方式</h1>

<div class="panel">
  <div class="eyebrow"><span class="tag">CH.07 · DESIGN SOFTWARE</span></div>
  <h1 class="ch-title">認識 Touch Panel Designer</h1>
  <p class="lede">畫面上看到的每一顆按鈕，都是透過 Windows 軟體「<b>Touch Panel Designer</b>」設計出來的 — 用拖拉元件、連接邏輯的方式，<b>不需要寫程式</b>。</p>

  <div class="small-h">開發五步驟</div>
  <div class="steps">
    <div class="step"><div class="sn">1</div><h4>新增專案</h4><p>選擇控制器型號與儲存路徑</p></div>
    <div class="step-arrow">${ic('arrow')}</div>
    <div class="step"><div class="sn">2</div><h4>介面設計</h4><p>拖拉元件，排出畫面長相</p></div>
    <div class="step-arrow">${ic('arrow')}</div>
    <div class="step"><div class="sn">3</div><h4>邏輯設計</h4><p>用模組接線，決定按下去會發生什麼事</p></div>

addChapter('ai','AI ASSISTANT','AI 輔助功能', `
<div class="panel">
  <div class="eyebrow"><span class="tag">CH.11 · AI ASSISTANT</span></div>
  <h1 class="ch-title">AI 輔助功能</h1>
  <p class="lede">Touch Panel Designer 內建 <b>AI 助理</b>，可以協助設計 UI 元件、優化程式邏輯，大幅縮短專案開發時間。</p>

  <div class="steps" style="margin-bottom:26px">
    <div class="step"><div class="sn">${ic('chat')}</div><h4>描述需求</h4><p>用文字告訴 AI 助理想要的介面或邏輯</p></div>
    <div class="step-arrow">${ic('arrow')}</div>
    <div class="step"><div class="sn">${ic('cog')}</div><h4>AI 產生建議</h4><p>自動產生元件配置或邏輯程式草稿</p></div>
    <div class="step-arrow">${ic('arrow')}</div>
    <div class="step"><div class="sn">${ic('wrench')}</div><h4>工程師微調</h4><p>在畫布上直接調整、完成專案</p></div>
  </div>

  <div class="callout">
    ${ic('lock')}
    <div><div class="t">需要自行申請 OpenAI API Key</div>
    <div class="d">AI 助理串接 ChatGPT 服務，需要使用者自行申請並綁定 OpenAI API Key，相關費用由使用者自行負擔 — Lumens 不提供測試用的 AI 帳號。</div></div>
  </div>
</div>`);

/* ---- 12 faq ---- */
addChapter('faq','FAQ','常見問題', `
<div class="panel">
  <div class="eyebrow"><span class="tag">CH.12 · FAQ</span></div>
  <h1 class="ch-title">常見問題</h1>
  <p class="lede">整理幾個第一次接觸 TP-200 最常被問到的問題。</p>

  <div class="card" style="padding:4px 18px">
    <div class="faq">
      <button class="faq-q" onclick="toggleFaq(this)">TP-200 可以控制 Lumens 以外的設備嗎？${ic('plus')}</button>
      <div class="faq-a"><p>可以。TP-200 支援 RS-485 序列通訊，以及 TCP／UDP／HTTP(S)／WebSocket 等通用網路協定，SI 工程師可在 Touch Panel Designer 中自行設計控制指令，串接第三方設備。</p></div>
    </div>
    <div class="faq">
      <button class="faq-q" onclick="toggleFaq(this)">設定錯誤或忘記密碼怎麼辦？${ic('plus')}</button>
      <div class="faq-a"><p>長按 RESET 鈕 5 秒以上，即可恢復原廠設定：IP 恢復為 192.168.0.101、管理密碼恢復為 admin。使用者已上傳的專案內容不會被刪除。</p></div>
    </div>
    <div class="faq">
      <button class="faq-q" onclick="toggleFaq(this)">後台與設計軟體支援哪些語言？${ic('plus')}</button>
      <div class="faq-a"><p>網頁後台與 Touch Panel Designer 都提供語言切換選項，目前含中文與英文介面。</p></div>
    </div>

/* ============ RENDER + NAV LOGIC ============ */
const stage = document.getElementById('stage');
const navlist = document.getElementById('navlist');
chapters.forEach((c,i)=>{
  stage.innerHTML += c.html;
  const li = document.createElement('li');
  li.innerHTML = `<button class="navlink" data-i="${i}"><span class="navnum">${String(i).padStart(2,'0')}</span>${c.name}</button>`;
  navlist.appendChild(li);
});
const panels = [...document.querySelectorAll('.panel')];
const navlinks = [...document.querySelectorAll('.navlink')];

/* mobile sidebar */
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
document.getElementById('menubtn').addEventListener('click', ()=>{
  sidebar.classList.add('open'); scrim.style.display='block';
});
scrim.addEventListener('click', closeSidebarMobile);
function closeSidebarMobile(){ sidebar.classList.remove('open'); scrim.style.display='none'; }

let current = 0;
function go(i){
  if(i<0) i=0; if(i>=chapters.length) i=chapters.length-1;
  current = i;
  panels.forEach((p,idx)=>p.classList.toggle('active', idx===i));
  navlinks.forEach((n,idx)=>n.classList.toggle('active', idx===i));
  document.getElementById('topLabel').textContent = String(i).padStart(2,'0')+' / '+String(chapters.length-1).padStart(2,'0');
  document.getElementById('topChapterName').textContent = chapters[i].name;
  document.getElementById('progressFill').style.width = (i/(chapters.length-1)*100)+'%';
  stage.scrollTop = 0;
  window.scrollTo(0,0);
  closeSidebarMobile();
  renderFootNav();
}
function renderFootNav(){
  const panel = panels[current];
  let old = panel.querySelector('.foot-nav'); if(old) old.remove();
  const div = document.createElement('div');
  div.className='foot-nav';
  const prevDisabled = current===0 ? 'disabled' : '';
  const nextLabel = current===chapters.length-1 ? '回到封面' : ('下一章：'+chapters[current+1].name);
  div.innerHTML = `
    <button class="nb" ${prevDisabled} onclick="go(${current-1})">${ic('arrow')} 上一章</button>
    <button class="nb primary" onclick="go(${current===chapters.length-1? 0 : current+1})">${nextLabel} ${ic('arrow')}</button>
  `;
  div.querySelector('.nb svg').style.transform='rotate(180deg)';
  panel.appendChild(div);
}
navlinks.forEach(n=>n.addEventListener('click', ()=>go(+n.dataset.i)));

const printMode = new URLSearchParams(location.search).get('print') === '1';
if(printMode){
  document.body.classList.add('print-mode');
  panels.forEach(p=>p.classList.add('active'));
} else {
  go(0);
}

function toggleFaq(btn){ btn.parentElement.classList.toggle('open'); }

</script>
